name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/noorul-islam-madrasa.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noorul-islam-madrasa-apk
          path: release-output/noorul-islam-madrasa.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: "Noorul Islam Madrasa Android APK v${{ github.run_number }}"
          body: |
            ### 📱 Noorul Islam Madrasa - Android APK Release
            
            This Android APK is automatically compiled by GitHub Actions.
            
            **Installation Instructions for Android Phone:**
            1. Download the `noorul-islam-madrasa.apk` file below directly onto your phone.
            2. Tap on the downloaded file to install.
            3. If prompted with *"Install unknown apps"*, allow Chrome/Files to proceed.
            4. Open the app and start managing Madrasa fees and students!
          files: release-output/noorul-islam-madrasa.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
